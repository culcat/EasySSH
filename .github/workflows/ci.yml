name: CI

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-ci:
    name: Rust (fmt, clippy, test, wasm target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Lint workspace with clippy (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests (cargo test)
        run: cargo test --workspace

      - name: Verify WASM target compilation
        run: |
          if [ -d "crates/wasm" ] || [ -d "crates/core" ]; then
            cargo check --target wasm32-unknown-unknown --workspace
          else
            echo "Rust crates not yet initialized in this commit, skipping WASM target check"
          fi

  react-ui-ci:
    name: React UI (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint React UI
        run: pnpm --filter ui-react lint

      - name: Typecheck React UI
        run: pnpm --filter ui-react typecheck

      - name: Run unit tests
        run: pnpm --filter ui-react test
