[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/terminal",
    "crates/relay",
    "crates/wasm",
    "apps/dev-cli",
    "apps/ui-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["EasySSH Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"
futures = "0.3"

# Crypto & Security
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.8", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"

# Error Handling & Observability
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Internal Workspace Crates
easyssh-proto = { path = "crates/proto" }
easyssh-core = { path = "crates/core" }
easyssh-terminal = { path = "crates/terminal" }
easyssh-relay = { path = "crates/relay" }
